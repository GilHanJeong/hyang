<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e8">
  <meta name="description" content="한길쌤의 교육 도구, 게임, 취미 프로젝트를 만나는 창작마당입니다.">
  <title>한길쌤’s 창작마당</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
  <script src="./game-scene.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#education">교육 콘텐츠로 이동</a>
  <header class="hero" id="home">
    <div class="hero-content">
      <h1><img src="./assets/title-wood-panel.png" width="1997" height="787" alt="한길쌤’s 창작마당" fetchpriority="high"></h1>
      <p class="intro">수업을 위한 도구부터, 즐거운 게임과 소소한 취미까지.<br>직접 만들고 가꾼 것들을 이 마당에 모아둡니다.</p>
      <nav class="home-menu" aria-label="마당 선택">
        <a href="#education">교육</a>
        <a href="#games">게임</a>
        <a href="#hobbies">취미</a>
      </nav>
      <noscript><p>분야별 화면을 보려면 브라우저의 자바스크립트를 켜주세요.</p></noscript>
    </div>
  </header>
  <main id="collections" data-theme="education" hidden>
    <div class="school-background" aria-hidden="true"></div>
    <div class="tab-bar"><div class="scene-home"><a href="#home" aria-label="메인 화면으로"><span>메인</span></a></div><div class="tabs" role="tablist" aria-label="창작마당 분야">
      <button id="tab-education" class="tab" type="button" role="tab" aria-selected="true" aria-controls="panel-education" data-category="education"><span>교육</span></button>
      <button id="tab-games" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-games" tabindex="-1" data-category="games"><span>게임</span></button>
      <button id="tab-hobbies" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-hobbies" tabindex="-1" data-category="hobbies"><span>취미</span></button>
    </div></div>
    <div class="content-wrap">
      <section id="panel-education" class="panel" role="tabpanel" aria-labelledby="tab-education" tabindex="0"></section>
      <section id="panel-games" class="panel" role="tabpanel" aria-labelledby="tab-games" tabindex="0" hidden></section>
      <section id="panel-hobbies" class="panel" role="tabpanel" aria-labelledby="tab-hobbies" tabindex="0" hidden></section>
      <noscript><p>분야별 목록을 보려면 브라우저의 자바스크립트를 켜주세요.</p></noscript>
    </div>
  </main>
</body>
</html>
